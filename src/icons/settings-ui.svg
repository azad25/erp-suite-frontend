<svg width="75" height="75" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Defining gradients for depth and color variety -->
  <defs>
    <linearGradient id="squareGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0288d1;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="centerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#b3e5fc;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef5350;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d32f2f;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="innerTeethGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#388e3c;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background square with gradient -->
  <rect x="10" y="10" width="80" height="80" rx="12" ry="12" fill="url(#squareGradient)" stroke="#2196f3" stroke-width="3"/>
  <!-- Gear (settings) -->
  <g transform="translate(50,50)">
    <!-- Gear teeth (12 teeth for detail) -->
    <path d="M-22 0 L-26 -6 L-26 6 Z 
             M22 0 L26 -6 L26 6 Z
             M0 -22 L-6 -26 L6 -26 Z
             M0 22 L-6 26 L6 26 Z
             M15.56 -15.56 L18.38 -18.38 L18.38 -15.56 Z
             M15.56 15.56 L18.38 18.38 L15.56 18.38 Z
             M-15.56 -15.56 L-18.38 -18.38 L-15.56 -18.38 Z
             M-15.56 15.56 L-18.38 18.38 L-18.38 15.56 Z
             M21.21 -7.78 L24.04 -10.61 L24.04 -7.78 Z
             M21.21 7.78 L24.04 10.61 L21.21 10.61 Z
             M-21.21 -7.78 L-24.04 -10.61 L-21.21 -10.61 Z
             M-21.21 7.78 L-24.04 10.61 L-24.04 7.78 Z" fill="url(#gearGradient)"/>
    <!-- Gear outer ring -->
    <circle r="20" fill="none" stroke="#1976d2" stroke-width="3"/>
    <!-- Gear center with layered design -->
    <circle r="12" fill="url(#centerGradient)" stroke="#0288d1" stroke-width="2"/>
    <!-- Inner center ring -->
    <circle r="8" fill="none" stroke="#0277bd" stroke-width="1.5"/>
    <!-- Center green dot (replacing previous blue core) -->
    <circle r="3" fill="#4caf50"/>
    <!-- Decorative bolts with red gradient -->
    <circle cx="16" cy="0" r="2" fill="url(#boltGradient)"/>
    <circle cx="-16" cy="0" r="2" fill="url(#boltGradient)"/>
    <circle cx="0" cy="16" r="2" fill="url(#boltGradient)"/>
    <circle cx="0" cy="-16" r="2" fill="url(#boltGradient)"/>
    <!-- Additional green dots (2 more, positioned symmetrically) -->
    <circle cx="11.31" cy="11.31" r="2" fill="#4caf50"/>
    <circle cx="-11.31" cy="-11.31" r="2" fill="#4caf50"/>
    <!-- Inner gear teeth with green gradient -->
    <path d="M-10 0 L-12 -3 L-12 3 Z 
             M10 0 L12 -3 L12 3 Z
             M0 -10 L-3 -12 L3 -12 Z
             M0 10 L-3 12 L3 12 Z" fill="url(#innerTeethGradient)"/>
  </g>
</svg>