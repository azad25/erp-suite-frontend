<svg width="75" height="75" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Appointment box (like a calendar) -->
  <rect x="20" y="30" width="110" height="90" rx="10" ry="10" stroke="#333" stroke-width="3" fill="#f0f0f0"/>
  
  <!-- Calendar header -->
  <rect x="20" y="30" width="110" height="20" fill="#2196f3" rx="10" ry="10"/>
  
  <!-- Header rings -->
  <rect x="30" y="20" width="10" height="10" fill="#333" rx="2" ry="2"/>
  <rect x="110" y="20" width="10" height="10" fill="#333" rx="2" ry="2"/>
  
  <!-- Clock circle (grey) centered -->
  <circle cx="75" cy="75" r="25" stroke="#888" stroke-width="3" fill="none"/>
  
  <!-- Clock hands (grey) -->
  <line x1="75" y1="75" x2="75" y2="60" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="75" x2="90" y2="75" stroke="#888" stroke-width="3" stroke-linecap="round"/>
</svg>
