<svg width="75" height="75" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PC monitor -->
  <rect x="20" y="20" width="110" height="70" rx="5" ry="5" stroke="#333" stroke-width="3" fill="#f0f0f0"/>
  
  <!-- Stand -->
  <rect x="65" y="90" width="20" height="10" fill="#333"/>
  <rect x="55" y="100" width="40" height="5" fill="#333"/>
  
  <!-- Chart bars inside monitor, centered -->
  <rect x="30" y="65" width="10" height="15" fill="#4caf50"/>
  <rect x="42" y="55" width="10" height="25" fill="#2196f3"/>
  <rect x="54" y="45" width="10" height="35" fill="#ff9800"/>
  <rect x="66" y="50" width="10" height="30" fill="#f44336"/>
  <rect x="78" y="60" width="10" height="20" fill="#9c27b0"/>
  <rect x="90" y="53" width="10" height="27" fill="#ffeb3b"/>
  <rect x="102" y="62" width="10" height="18" fill="#00bcd4"/>
  
  <!-- Small upward curved arrow inside screen, centered -->
  <path d="M50 65 C65 50, 85 50, 100 35" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrowhead -->
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="5" refX="0" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#888"/>
    </marker>
  </defs>
</svg>