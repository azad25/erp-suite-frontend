<svg width="75" height="75" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background square -->
  <rect x="10" y="10" width="80" height="80" rx="12" ry="12" fill="#e3f2fd" stroke="#2196f3" stroke-width="3"/>

  <!-- Building 1 (tallest, center) -->
  <rect x="42" y="20" width="16" height="50" fill="#4fc3f7"/>
  <!-- Windows on Building 1 -->
  <rect x="45" y="25" width="3" height="3" fill="#ffffff"/>
  <rect x="52" y="25" width="3" height="3" fill="#ffffff"/>
  <rect x="45" y="32" width="3" height="3" fill="#ffffff"/>
  <rect x="52" y="32" width="3" height="3" fill="#ffffff"/>
  <rect x="45" y="39" width="3" height="3" fill="#ffffff"/>
  <rect x="52" y="39" width="3" height="3" fill="#ffffff"/>

  <!-- Building 2 (left, medium height) -->
  <rect x="22" y="30" width="14" height="40" fill="#9575cd"/>
  <!-- Windows on Building 2 -->
  <rect x="25" y="35" width="3" height="3" fill="#ffffff"/>
  <rect x="31" y="35" width="3" height="3" fill="#ffffff"/>
  <rect x="25" y="42" width="3" height="3" fill="#ffffff"/>
  <rect x="31" y="42" width="3" height="3" fill="#ffffff"/>

  <!-- Building 3 (right, shortest) -->
  <rect x="64" y="40" width="14" height="30" fill="#ffd54f"/>
  <!-- Windows on Building 3 -->
  <rect x="67" y="45" width="3" height="3" fill="#ffffff"/>
  <rect x="73" y="45" width="3" height="3" fill="#ffffff"/>

  <!-- Small upward arrow (growth indicator) -->
  <path d="M45 65 C50 55, 55 55, 60 45" stroke="#90ee90" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead -->
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="5" refX="0" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#90ee90"/>
    </marker>
  </defs>
</svg>
