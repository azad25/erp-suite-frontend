<svg width="75" height="75" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Calendar body -->
  <rect x="20" y="30" width="110" height="90" rx="5" ry="5" stroke="#333" stroke-width="3" fill="#f0f0f0"/>
  
  <!-- Calendar header -->
  <rect x="20" y="30" width="110" height="20" fill="#2196f3" rx="5" ry="5"/>
  
  <!-- Header rings -->
  <rect x="30" y="20" width="10" height="10" fill="#333" rx="2" ry="2"/>
  <rect x="110" y="20" width="10" height="10" fill="#333" rx="2" ry="2"/>
  
  <!-- Grid lines (dates) -->
  <line x1="20" y1="55" x2="130" y2="55" stroke="#ccc" stroke-width="1"/>
  <line x1="20" y1="70" x2="130" y2="70" stroke="#ccc" stroke-width="1"/>
  <line x1="20" y1="85" x2="130" y2="85" stroke="#ccc" stroke-width="1"/>
  <line x1="20" y1="100" x2="130" y2="100" stroke="#ccc" stroke-width="1"/>
  <line x1="20" y1="115" x2="130" y2="115" stroke="#ccc" stroke-width="1"/>
  
  <line x1="40" y1="30" x2="40" y2="120" stroke="#ccc" stroke-width="1"/>
  <line x1="55" y1="30" x2="55" y2="120" stroke="#ccc" stroke-width="1"/>
  <line x1="70" y1="30" x2="70" y2="120" stroke="#ccc" stroke-width="1"/>
  <line x1="85" y1="30" x2="85" y2="120" stroke="#ccc" stroke-width="1"/>
  <line x1="100" y1="30" x2="100" y2="120" stroke="#ccc" stroke-width="1"/>
  <line x1="115" y1="30" x2="115" y2="120" stroke="#ccc" stroke-width="1"/>
  
  <!-- Example selected date -->
  <rect x="55" y="70" width="15" height="15" fill="#ff9800" rx="2" ry="2"/>
</svg>
