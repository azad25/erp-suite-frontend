<svg width="75" height="75" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- To-Do card -->
  <rect x="20" y="30" width="110" height="90" rx="10" ry="10" stroke="#333" stroke-width="3" fill="#f0f0f0"/>
  
  <!-- Header of card -->
  <rect x="20" y="30" width="110" height="20" fill="#2196f3" rx="10" ry="10"/>
  
  <!-- Header rings -->
  <rect x="30" y="20" width="10" height="10" fill="#333" rx="2" ry="2"/>
  <rect x="110" y="20" width="10" height="10" fill="#333" rx="2" ry="2"/>
  
  <!-- Task lines -->
  <line x1="35" y1="60" x2="115" y2="60" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="75" x2="115" y2="75" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="90" x2="115" y2="90" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Checkmark on first task -->
  <path d="M35 60 L45 70 L65 50" stroke="#4caf50" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
