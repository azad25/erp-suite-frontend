<svg width="75" height="75" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded card background -->
  <rect x="10" y="10" width="80" height="80" rx="14" ry="14" fill="#f9fbfd" stroke="#1e88e5" stroke-width="2.5"/>

  <!-- Back envelope -->
  <rect x="28" y="26" width="44" height="38" rx="6" ry="6" fill="#bbdefb"/>

  <!-- Middle envelope -->
  <rect x="26" y="28" width="48" height="42" rx="6" ry="6" fill="#90caf9"/>

  <!-- Front envelope -->
  <rect x="32" y="34" width="44" height="38" rx="6" ry="6" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>

  <!-- Envelope flap -->
  <polygon points="32,34 54,50 76,34" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>

  <!-- Notification bubble (changed to green) -->
  <circle cx="72" cy="34" r="6" fill="#4caf50" stroke="#1e88e5" stroke-width="2"/>
</svg>