<svg width="75" height="75" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded card background -->
  <rect x="10" y="10" width="80" height="80" rx="14" ry="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="3"/>

  <!-- Document in background -->
  <rect x="30" y="25" width="40" height="50" rx="3" fill="#ffffff" stroke="#1976d2" stroke-width="2"/>
  <line x1="35" y1="35" x2="65" y2="35" stroke="#64b5f6" stroke-width="2"/>
  <line x1="35" y1="45" x2="65" y2="45" stroke="#64b5f6" stroke-width="2"/>
  <line x1="35" y1="55" x2="65" y2="55" stroke="#64b5f6" stroke-width="2"/>

  <!-- People icons in front -->
  <!-- Center person -->
  <circle cx="50" cy="40" r="8" fill="#43a047"/> <!-- green -->
  <rect x="44" y="48" width="12" height="15" rx="2" fill="#66bb6a"/>

  <!-- Left person -->
  <circle cx="38" cy="50" r="6" fill="#fb8c00"/> <!-- orange -->
  <rect x="34" y="56" width="8" height="12" rx="2" fill="#ffa726"/>

  <!-- Right person -->
  <circle cx="62" cy="50" r="6" fill="#e53935"/> <!-- red -->
  <rect x="58" y="56" width="8" height="12" rx="2" fill="#ef5350"/>
</svg>
